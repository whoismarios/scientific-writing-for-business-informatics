<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="thesis-editor und code-docs: Agent-Skills für Lektorat der Arbeit in LaTeX und Dokumentation des Codes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d92d20"/>
      <stop offset="0.25" stop-color="#e8590c"/>
      <stop offset="0.5" stop-color="#c11574"/>
      <stop offset="0.75" stop-color="#2a5bd7"/>
      <stop offset="1" stop-color="#7a3fc4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect y="392" width="1280" height="8" fill="url(#accent)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="82" y="96" fill="#94a3b8" font-size="15" font-weight="600" letter-spacing="2">AGENT-SKILLS FÜR DIE ABSCHLUSSARBEIT</text>
    <text x="78" y="160" fill="#ffffff" font-size="62" font-weight="800" letter-spacing="-2"><tspan fill="#64748b">/</tspan>thesis-editor</text>
    <text x="78" y="226" fill="#a5b4fc" font-size="62" font-weight="800" letter-spacing="-2"><tspan fill="#64748b">/</tspan>code-docs</text>
    <text x="82" y="270" fill="#cbd5e1" font-size="21">Lektorat der Arbeit in LaTeX · Dokumentation des Codes</text>

    <g font-size="15" font-weight="600">
      <rect x="82" y="300" width="214" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="189" y="322" fill="#e2e8f0" text-anchor="middle">84 Regeln · 6 Gutachter</text>
      <rect x="308" y="300" width="170" height="34" rx="17" fill="#6366f1" fill-opacity="0.16" stroke="#a5b4fc" stroke-opacity="0.35"/>
      <text x="393" y="322" fill="#c7d2fe" text-anchor="middle">Google-Docstrings</text>
      <rect x="490" y="300" width="160" height="34" rx="17" fill="#6366f1" fill-opacity="0.16" stroke="#a5b4fc" stroke-opacity="0.35"/>
      <text x="570" y="322" fill="#c7d2fe" text-anchor="middle">README-Abgleich</text>
    </g>
  </g>

  <g transform="translate(700 44)" filter="url(#shadow)">
    <rect width="400" height="232" rx="14" fill="#0b1120" stroke="#334155"/>
    <circle cx="22" cy="20" r="6" fill="#ef4444"/>
    <circle cx="42" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="62" cy="20" r="6" fill="#22c55e"/>
    <text x="380" y="25" fill="#64748b" font-size="13" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">05_methodik.tex</text>
    <line x1="0" y1="40" x2="400" y2="40" stroke="#1e293b"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
      <text x="24" y="72" fill="#7dd3fc">\section<tspan fill="#e2e8f0">{Stichprobe}</tspan></text>
      <text x="24" y="100" fill="#e2e8f0">Wir haben 48 Personen befragt<tspan fill="#60a5fa" font-weight="700" font-size="11" dy="-8">[1]</tspan><tspan dy="8">.</tspan></text>
      <text x="24" y="128" fill="#e2e8f0">Die Ergebnisse sind beeindruckend<tspan fill="#60a5fa" font-weight="700" font-size="11" dy="-8">[2]</tspan></text>
      <text x="24" y="156" fill="#e2e8f0">Studien zeigen<tspan fill="#f472b6" font-weight="700" font-size="11" dy="-8">[3]</tspan><tspan dy="8"> den Effekt.</tspan></text>
      <text x="24" y="184" fill="#f87171">\quellefehlt<tspan fill="#e2e8f0">{Meta-Analyse}</tspan></text>
      <text x="24" y="212" fill="#fb923c">\offen<tspan fill="#e2e8f0">{Ausschlüsse}</tspan></text>
    </g>
  </g>

  <g transform="translate(936 236)" filter="url(#shadow)">
    <rect width="316" height="146" rx="14" fill="#0b1120" stroke="#334155"/>
    <circle cx="22" cy="20" r="6" fill="#ef4444"/>
    <circle cx="42" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="62" cy="20" r="6" fill="#22c55e"/>
    <text x="296" y="25" fill="#64748b" font-size="13" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">service.py</text>
    <line x1="0" y1="40" x2="316" y2="40" stroke="#1e293b"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
      <text x="16" y="60" fill="#c084fc">def <tspan fill="#7dd3fc">total</tspan><tspan fill="#e2e8f0">(prices, discount):</tspan></text>
      <text x="47" y="79" fill="#86efac">"""Sums prices minus discount.</text>
      <text x="47" y="97" fill="#86efac">Args:</text>
      <text x="78" y="115" fill="#86efac">prices: Prices in euros.</text>
      <text x="47" y="133" fill="#86efac">Returns: The sum."""</text>
    </g>
  </g>
</svg>
