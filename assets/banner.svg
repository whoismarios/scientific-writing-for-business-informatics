<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="thesis-editor: Lektorat für wissenschaftliche Arbeiten in LaTeX">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d92d20"/>
      <stop offset="0.25" stop-color="#e8590c"/>
      <stop offset="0.5" stop-color="#c11574"/>
      <stop offset="0.75" stop-color="#2a5bd7"/>
      <stop offset="1" stop-color="#7a3fc4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect y="392" width="1280" height="8" fill="url(#accent)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="150" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-2">thesis-editor</text>
    <text x="82" y="200" fill="#cbd5e1" font-size="26">Lektorat für wissenschaftliche Arbeiten in LaTeX</text>
    <text x="82" y="236" fill="#94a3b8" font-size="20">Wirtschaftsinformatik · Bachelor · Master · Seminar · Paper</text>

    <g font-size="15" font-weight="600">
      <rect x="82" y="282" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="157" y="304" fill="#e2e8f0" text-anchor="middle">84 Regeln</text>
      <rect x="244" y="282" width="190" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="339" y="304" fill="#e2e8f0" text-anchor="middle">5 Gutachter-Agenten</text>
      <rect x="446" y="282" width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="544" y="304" fill="#e2e8f0" text-anchor="middle">HTML-Bericht + PDF</text>
    </g>
  </g>

  <g transform="translate(760 70)">
    <rect width="440" height="260" rx="14" fill="#0b1120" stroke="#334155"/>
    <circle cx="22" cy="20" r="6" fill="#ef4444"/>
    <circle cx="42" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="62" cy="20" r="6" fill="#22c55e"/>
    <text x="420" y="25" fill="#64748b" font-size="13" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">05_methodik.tex</text>
    <line x1="0" y1="40" x2="440" y2="40" stroke="#1e293b"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
      <text x="24" y="76" fill="#7dd3fc">\section<tspan fill="#e2e8f0">{Stichprobe}</tspan></text>
      <text x="24" y="108" fill="#e2e8f0">Wir haben 48 Personen befragt<tspan fill="#60a5fa" font-weight="700" font-size="11" dy="-8">[1]</tspan><tspan dy="8">.</tspan></text>
      <text x="24" y="138" fill="#e2e8f0">Die Ergebnisse sind beeindruckend<tspan fill="#60a5fa" font-weight="700" font-size="11" dy="-8">[2]</tspan></text>
      <text x="24" y="168" fill="#e2e8f0">Studien zeigen<tspan fill="#f472b6" font-weight="700" font-size="11" dy="-8">[3]</tspan><tspan dy="8"> den Effekt</tspan></text>
      <text x="24" y="198" fill="#f87171">\quellefehlt<tspan fill="#e2e8f0">{Meta-Analyse}</tspan></text>
      <text x="24" y="228" fill="#fb923c">\offen<tspan fill="#e2e8f0">{Zahl der Ausschlüsse}</tspan></text>
    </g>
  </g>
</svg>
