schwere = "Fehler"
farbe = "stil"
pruefung = "linter"
herkunft = "SR, FB"
warum = "Semikolons verlängern Satzgefüge und verwischen die Gliederung. Ein Punkt oder ein Nebensatz trennt Gedanken klarer. Die Regel gilt auch in Tabellen, Bildunterschriften und Markern."
falsch = "Die Stränge laufen parallel; die Fusion folgt danach."
richtig = "Die Stränge laufen parallel. Die Fusion folgt danach."

[[regel]]
