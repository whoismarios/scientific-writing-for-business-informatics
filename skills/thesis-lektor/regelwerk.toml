farbe = "stil"
pruefung = "linter"
herkunft = "SR"
warum = "Der Geviertstrich (—) ist ein Stilmittel des Journalismus und der Prosa. Im wissenschaftlichen Text trägt ein Nebensatz oder ein Komma dieselbe Information sachlicher."
