farbe = "struktur"
pruefung = "linter"
herkunft = "SR"
warum = "Ohne \\caption erscheint das Objekt in keinem Verzeichnis und lässt sich nicht beschreiben."
falsch = "\\begin{figure} ... ohne \\caption"
richtig = "\\caption{...}"

[[regel]]
id = "FMT-LABEL"
titel = "Gleitobjekt mit Label"
schwere = "Fehler"
farbe = "struktur"
pruefung = "linter"
herkunft = "SR"
warum = "Ohne \\label kann der Text nicht auf das Objekt verweisen."
