# Regelwerk thesis-lektor
# Einzige Quelle für Regeln, Schweregrade, Farben und Wortlisten.
# references/regelwerk.md wird daraus erzeugt: python3 scripts/lektorat.py regeln
#
# schwere:  Fehler | Warnung | Hinweis | Offen
# farbe:    quelle (rot) | offen (orange) | beleg (magenta) | stil (blau) | struktur (violett) | keine
# pruefung: linter | bib | agent | umfeld (Git, zählt nicht zum Lektoratsindex)
# herkunft: SR = Schreibregeln aus der Betreuung einer Masterarbeit, FB = Festlegung im Betreuungs- und Schreibprozess,
#           APA7 = APA Publication Manual 7. Aufl., WI = Konvention der Wirtschaftsinformatik,
#           DUDEN = Duden-Empfehlung, TYPO = deutsche Typografie-Konvention

[meta]
version = "1.1.0"
name = "thesis-lektor"

[farben]
quelle = "red"
offen = "orange!85!black"
beleg = "magenta!80!black"
stil = "blue!70!black"
struktur = "violet!80!black"

# ---------------------------------------------------------------------------
# Typografie
# ---------------------------------------------------------------------------

[[regel]]
id = "TYP-SEMIKOLON"
