titel = "Gleitobjekt wird im Text referenziert"
schwere = "Warnung"
farbe = "struktur"
pruefung = "linter"
herkunft = "SR"
warum = "Jede Abbildung und Tabelle braucht einen Verweis, der sagt, was Lesende darin sehen sollen."
falsch = "Tabelle ohne \\cref im Text"
richtig = "wie \\cref{tab:x} zeigt, ..."

[[regel]]
